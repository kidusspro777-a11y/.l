<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Xen Control</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#06060c;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);
  --txt:#eef0ff;--mut:#868bb0;--on:#22f2a5;--off:#ff4d6d;--acc:#7c5cff;--acc2:#00d4ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
body{min-height:100vh;padding:14px 14px 40px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 14s ease-in-out infinite alternate}
body::before{background:var(--acc);top:-140px;left:-120px}
body::after{background:var(--acc2);bottom:-160px;right:-140px;animation-delay:-6s}
@keyframes float{to{transform:translate(60px,50px) scale(1.15)}}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;letter-spacing:.14em;margin:0;font-weight:800;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);box-shadow:0 0 10px var(--off)}
.dot.live{background:var(--on);box-shadow:0 0 10px var(--on)}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer}

/* ---------- HERO POWER ---------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:26px 0 22px;margin-bottom:14px;border-radius:30px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.power{position:relative;width:176px;height:176px;border-radius:50%;border:0;cursor:pointer;color:#fff;
  display:grid;place-items:center;transition:transform .15s,box-shadow .4s,background .4s}
.power:active{transform:scale(.94)}
.power svg{width:72px;height:72px;transition:transform .5s,filter .4s}
.power.on{background:radial-gradient(circle at 30% 25%,#5dffc6,#0fb57a 70%);box-shadow:0 0 60px rgba(34,242,165,.55),inset 0 -8px 24px rgba(0,0,0,.25)}
.power.off{background:radial-gradient(circle at 30% 25%,#3a3a55,#17172a 70%);box-shadow:0 0 0 rgba(0,0,0,0),inset 0 -8px 24px rgba(0,0,0,.4);color:#8d90b3}
.power.on svg{filter:drop-shadow(0 0 10px rgba(255,255,255,.8))}
.power::before,.power::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--on);opacity:0;pointer-events:none}
.power.on::before{animation:ring 2.4s ease-out infinite}
.power.on::after{animation:ring 2.4s ease-out 1.2s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.power.burst-on{animation:burstOn .7s cubic-bezier(.2,1.4,.4,1)}
.power.burst-off{animation:burstOff .5s ease}
@keyframes burstOn{0%{transform:scale(.8)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes burstOff{0%{transform:scale(1)}30%{transform:scale(.88)}100%{transform:scale(1)}}
.power.on svg{transform:rotate(360deg)}
.state-label{margin-top:18px;font-size:26px;font-weight:800;letter-spacing:.2em}
.state-label.on{color:var(--on);text-shadow:0 0 22px rgba(34,242,165,.6)}
.state-label.off{color:var(--off)}
.sub{margin-top:6px;font-size:13px;color:var(--mut)}

/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.stat{padding:12px 4px;text-align:center;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:20px}
.stat span{font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}

/* ---------- CARDS ---------- */
.card{padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.row{display:flex;align-items:center;gap:14px;min-height:72px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.04);margin-bottom:10px;cursor:pointer;transition:opacity .3s,background .2s}
.row:active{background:rgba(255,255,255,.09)}
.row.locked{opacity:.4;pointer-events:none}
.row .ic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:rgba(124,92,255,.18)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px}
.row .tx small{color:var(--mut);font-size:12px}
.sw{position:relative;width:62px;height:34px;border-radius:99px;background:#2a2b44;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:linear-gradient(90deg,#16c98a,var(--on))}
.sw.on::after{transform:translateX(28px)}

.btn{width:100%;height:56px;border:0;border-radius:18px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn.danger{background:linear-gradient(90deg,#ff4d6d,#ff8a5c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input,textarea,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt);font-size:15px;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:80px;resize:vertical}
.inline{display:flex;gap:10px;margin-top:10px}
.inline input{flex:1}
.inline .btn{width:auto;padding:0 20px;height:50px}
pre.res{margin:12px 0 0;padding:12px;border-radius:14px;background:rgba(0,0,0,.4);font-size:12px;white-space:pre-wrap;word-break:break-word;color:#b9f5dc;display:none}

/* ---------- LOG ---------- */
.log{max-height:300px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
.log div{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);word-break:break-word}
.log i{color:var(--mut);font-style:normal;margin-right:6px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;margin-right:6px;font-weight:700;text-transform:uppercase}
.tag.timer{background:#3b2f8f}.tag.redeem{background:#0e6b55}.tag.ai{background:#7a2f86}.tag.error{background:#8f2f3f}.tag.ctl{background:#33405c}
.empty{color:var(--mut);text-align:center;padding:18px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);padding:13px 20px;border-radius:16px;background:#1d1e33;border:1px solid var(--line);font-size:14px;transition:transform .3s;z-index:9}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>XEN CONTROL</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="chip"><span class="dot" id="dot"></span><span id="conn">…</span></span>
      <button class="iconbtn" id="soundBtn" title="Sound">🔊</button>
    </div>
  </header>

  <!-- BIG POWER BUTTON -->
  <section class="hero">
    <button class="power off" id="power" aria-label="Enable or disable bot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
    </button>
    <div class="state-label off" id="stateLabel">OFFLINE</div>
    <div class="sub" id="sub">Tap to enable</div>
  </section>

  <section class="stats">
    <div class="stat"><b id="s_dms">0</b><span>DMs</span></div>
    <div class="stat"><b id="s_redeems">0</b><span>Redeem</span></div>
    <div class="stat"><b id="s_replies">0</b><span>Replies</span></div>
    <div class="stat"><b id="s_winners">0</b><span>Winners</span></div>
    <div class="stat"><b id="s_pending">0</b><span>Timers</span></div>
  </section>

  <section class="card">
    <h2>Features</h2>
    <div id="features"></div>
  </section>

  <section class="card">
    <h2>Quick actions</h2>
    <label style="margin-top:0">Redeem a code now</label>
    <div class="inline">
      <input id="manualCode" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters">
      <button class="btn" id="btnRedeem">Redeem</button>
    </div>
    <div class="grid2" style="margin-top:12px">
      <button class="btn ghost" id="btnCancel">⏹ Cancel timers</button>
      <button class="btn ghost" id="btnClear">🧹 Clear log</button>
    </div>
  </section>

  <section class="card">
    <h2>Test Gemini (dry run)</h2>
    <select id="testKind"><option value="post">Channel post</option><option value="comment">Comment</option></select>
    <label>Message</label>
    <textarea id="testText" placeholder='e.g. "First comment wins 🎁"'></textarea>
    <button class="btn" id="btnTest" style="margin-top:10px">Run test</button>
    <pre class="res" id="testRes"></pre>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <label style="margin-top:0">Watch channels (comma separated, empty = all)</label>
    <input id="f_watch" placeholder="dropschannel, X9_DROPS">
    <div class="grid2">
      <div><label>Redeem bot</label><input id="f_bot"></div>
      <div><label>Redeem command</label><input id="f_cmd"></div>
      <div><label>Max retries</label><input id="f_retries" type="number" min="1" max="50"></div>
      <div><label>Reply text</label><input id="f_dot"></div>
      <div><label>Lead (ms early)</label><input id="f_lead" type="number" step="1"></div>
      <div><label>Late grace (sec)</label><input id="f_grace" type="number" min="0"></div>
    </div>
    <label>Gemini model</label>
    <input id="f_model">
    <button class="btn" id="btnSave" style="margin-top:16px">💾 Save settings</button>
  </section>

  <section class="card">
    <h2>Live log</h2>
    <div class="log" id="log"></div>
  </section>
</div>
<div id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#06060c'); tg.setBackgroundColor('#06060c'); } catch(e){} }
const KEY = new URLSearchParams(location.search).get('k') || '';
const $ = id => document.getElementById(id);
const FEATURES = [
  ['timer_dm','⏱️','Timed DM','Send the code at the exact IST time'],
  ['auto_redeem','🎟️','Auto Redeem','Random code → redeem bot'],
  ['giveaway_ai','🤖','Giveaway AI','Gemini watches posts & comments'],
  ['answer_questions','💬','Answer Questions','Only giveaway questions'],
  ['reply_winner','🏆','Winner Replies','Reply when a winner is announced'],
];
let st = null, busy = 0, fails = 0;
let soundOn = localStorage.getItem('xen_sound') !== '0';

/* ---------- sound (WebAudio, no files) ---------- */
let ac;
function audio(){ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f, delay, dur, type, vol, fEnd){
  if(!soundOn) return;
  try{
    const a = audio(), t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(f, t);
    if(fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||.15, t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
function sndOn(){ tone(180,0,.45,'sawtooth',.07,900); [392,523,659,784,1047].forEach((f,i)=>tone(f,.05+i*.07,.3,'triangle',.13)); tone(1568,.42,.5,'sine',.07); }
function sndOff(){ [784,587,440,330,220].forEach((f,i)=>tone(f,i*.08,.28,'triangle',.12)); tone(600,0,.55,'sawtooth',.05,70); }
function sndClick(){ tone(950,0,.05,'square',.035); tone(1400,.03,.05,'square',.025); }
function haptic(t){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'medium'); }catch(e){} }

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------- api ---------- */
async function api(path, method, body){
  const r = await fetch(path, {method: method||'GET', headers:{'Content-Type':'application/json','X-Key':KEY}, body: body?JSON.stringify(body):undefined});
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

/* ---------- render ---------- */
function fmtUp(s){ const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h? h+'h '+m+'m' : m+'m '+(s%60)+'s'; }
function build(){
  const box = $('features'); box.innerHTML = '';
  FEATURES.forEach(([k,ic,t,d])=>{
    const row = document.createElement('div'); row.className='row'; row.id='row_'+k;
    row.innerHTML = `<div class="ic">${ic}</div><div class="tx"><b>${t}</b><small>${d}</small></div><div class="sw" id="sw_${k}"></div>`;
    row.onclick = ()=>toggle(k);
    box.appendChild(row);
  });
}
function render(){
  if(!st) return;
  const s = st.settings, on = !!s.enabled;
  const p = $('power'); p.classList.toggle('on', on); p.classList.toggle('off', !on);
  const L = $('stateLabel'); L.textContent = on ? 'ACTIVE' : 'OFFLINE'; L.className = 'state-label ' + (on?'on':'off');
  $('sub').textContent = on ? ('Running · up ' + fmtUp(st.uptime) + (st.me ? ' · '+st.me : '')) : 'Tap to enable';
  FEATURES.forEach(([k])=>{
    $('sw_'+k).classList.toggle('on', !!s[k]);
    $('row_'+k).classList.toggle('locked', !on);
  });
  for(const k of ['dms','redeems','replies','winners']) $('s_'+k).textContent = st.stats[k];
  $('s_pending').textContent = st.pending;
  const ae = document.activeElement;
  const set = (id,v)=>{ if(ae!==$(id)) $(id).value = v; };
  set('f_watch', (s.watch_chats||[]).join(', ')); set('f_bot', s.redeem_bot); set('f_cmd', s.redeem_cmd);
  set('f_retries', s.max_retries); set('f_dot', s.dot_text); set('f_lead', s.lead_ms);
  set('f_grace', s.late_grace); set('f_model', s.gemini_model);
  const lg = $('log'); lg.innerHTML = '';
  if(!st.log.length){ lg.innerHTML = '<div class="empty">No activity yet</div>'; }
  st.log.slice().reverse().forEach(e=>{
    const d = document.createElement('div');
    const i = document.createElement('i'); i.textContent = e.t;
    const t = document.createElement('span'); t.className='tag '+e.tag; t.textContent=e.tag;
    d.append(i,t,document.createTextNode(e.msg)); lg.appendChild(d);
  });
}
function conn(ok){
  $('dot').classList.toggle('live', ok); $('conn').textContent = ok ? 'Connected' : 'Bot offline';
}

/* ---------- actions ---------- */
async function poll(){
  if(busy) return;
  try{ const s = await api('/api/state'); if(!busy){ st = s; render(); } fails = 0; conn(true); }
  catch(e){ if(++fails >= 2) conn(false); if(String(e.message).includes('unauthorized')) $('conn').textContent='Bad key'; }
}
async function power(){
  if(!st) return;
  const val = !st.settings.enabled;
  busy++; st.settings.enabled = val; render();
  const p = $('power'); p.classList.remove('burst-on','burst-off'); void p.offsetWidth; p.classList.add(val?'burst-on':'burst-off');
  val ? sndOn() : sndOff(); haptic(val?'heavy':'medium');
  try{ st = await api('/api/toggle','POST',{key:'enabled', value:val}); conn(true); }
  catch(e){ st.settings.enabled = !val; toast('Failed: '+e.message); conn(false); }
  finally{ busy--; render(); }
}
async function toggle(k){
  if(!st) return;
  const val = !st.settings[k];
  busy++; st.settings[k] = val; render(); sndClick(); haptic('light');
  try{ st = await api('/api/toggle','POST',{key:k, value:val}); }
  catch(e){ st.settings[k] = !val; toast('Failed: '+e.message); }
  finally{ busy--; render(); }
}
async function act(fn, okMsg){
  busy++; sndClick(); haptic('light');
  try{ const r = await fn(); if(r && r.settings){ st = r; } toast(okMsg); }
  catch(e){ toast('Error: '+e.message); }
  finally{ busy--; poll(); }
}

$('power').onclick = power;
$('soundBtn').onclick = ()=>{ soundOn = !soundOn; localStorage.setItem('xen_sound', soundOn?'1':'0'); $('soundBtn').textContent = soundOn?'🔊':'🔇'; if(soundOn) sndClick(); };
$('soundBtn').textContent = soundOn?'🔊':'🔇';
$('btnRedeem').onclick = ()=>{ const c=$('manualCode').value.trim(); if(!c) return toast('Enter a code'); act(()=>api('/api/redeem','POST',{code:c}),'Redeem sent'); };
$('btnCancel').onclick = ()=>act(()=>api('/api/cancel','POST',{}),'Timers cancelled');
$('btnClear').onclick = ()=>act(()=>api('/api/clear','POST',{}),'Log cleared');
$('btnSave').onclick = ()=>act(()=>api('/api/settings','POST',{
  watch_chats:$('f_watch').value, redeem_bot:$('f_bot').value, redeem_cmd:$('f_cmd').value,
  max_retries:$('f_retries').value, dot_text:$('f_dot').value, lead_ms:$('f_lead').value,
  late_grace:$('f_grace').value, gemini_model:$('f_model').value
}),'Settings saved');
$('btnTest').onclick = async ()=>{
  const text=$('testText').value.trim(); if(!text) return toast('Type a message');
  busy++; sndClick(); const pre=$('testRes'); pre.style.display='block'; pre.textContent='Asking Gemini…';
  try{ const r = await api('/api/test','POST',{text, kind:$('testKind').value}); pre.textContent = JSON.stringify(r.result,null,2); }
  catch(e){ pre.textContent = 'Error: '+e.message; }
  finally{ busy--; }
};

build(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
